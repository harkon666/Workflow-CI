name: Continuous Integration & Model Training Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mlflow-ci-retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas numpy scikit-learn joblib

      - name: Run MLflow Project Retraining
        run: |
          export MLFLOW_ALLOW_FILE_STORE=true
          mlflow run MLProject --entry-point main -P n_estimators=120 -P max_depth=6

      - name: Build Docker Image using MLflow
        run: |
          echo "Building Docker image with MLflow build-docker..."
          # mlflow models build-docker -m "runs:/<run_id>/model" -n "bryandewa/heart-disease-model:latest"

      - name: Upload Trained Model Artifact
        uses: actions/upload-artifact@v3
        with:
          name: mlflow-trained-model
          path: mlruns/
