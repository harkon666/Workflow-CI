name: Continuous Integration & Model Training Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mlflow-ci-retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas numpy scikit-learn joblib

      - name: Run MLflow Project Retraining
        run: |
          export MLFLOW_ALLOW_FILE_STORE=true
          mlflow run MLProject --env-manager local --entry-point main -P n_estimators=120 -P max_depth=6

      - name: Upload Trained Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-trained-model
          path: mlruns/
